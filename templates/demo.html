<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #101418;
        color: #e6edf3;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .card {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 56px;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 28px;
        color: #9fb0c0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>{{ title }}</h1>
      <p>{{ subtitle }}</p>
    </div>
  </body>
</html>
