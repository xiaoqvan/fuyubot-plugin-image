[package]
name = "image-plugin"
description = "FuyuBot HTML 出图插件：注册 image.render，用 Ultralight 把 HTML 截成图片"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiaoqvan/fuyubot-plugin-image"

# 独立仓库：不要被上层目录的 workspace 吸进去。
[workspace]

[lib]
# cdylib 给宿主加载；rlib 让同包的 bin 复用协议与 FFI。
crate-type = ["cdylib", "rlib"]

# Ultralight 要求 Renderer 在主线程创建并驱动；宿主主线程归 tokio，所以渲染器独立成进程。
[[bin]]
name = "image-shot"
path = "src/bin/image-shot.rs"

[dependencies]
fuyubot-abi = "0.1.2"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
